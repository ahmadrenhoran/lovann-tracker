services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lovann
      POSTGRES_USER: lovann
      POSTGRES_PASSWORD: lovann
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
    ports:
      - "7860:7860"
    volumes:
      - n8n_data:/data/.n8n

volumes:
  postgres_data:
  n8n_data:
